<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Route Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #111214;
      --muted: #6d7178;
      --line: #e4e6ea;
      --accent: #00a86b;
      --accent-soft: #e9f8f2;
      --danger: #d93025;
      --shadow: 0 8px 28px rgba(0,0,0,.07);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
        Helvetica, Arial, sans-serif;
    }

    body {
      padding: calc(18px + var(--safe-top)) 16px calc(28px + var(--safe-bottom));
    }

    .container {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    header {
      margin-bottom: 18px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -1px;
    }

    .sub {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .search-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .search-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      margin-bottom: 7px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      height: 50px;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
      background: #fafafa;
      color: var(--text);
    }

    #searchInput:focus {
      border-color: var(--accent);
      background: #fff;
    }

    #clearSearch {
      width: 50px;
      height: 50px;
      border: 0;
      border-radius: 13px;
      background: #eceef1;
      color: #333;
      font-size: 20px;
      font-weight: 700;
    }

    .search-result {
      display: none;
      margin-top: 11px;
      border-radius: 13px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 650;
    }

    .search-result.show {
      display: block;
    }

    .search-result.found {
      background: var(--accent-soft);
      color: #08734d;
    }

    .search-result.not-found {
      background: #fff0ef;
      color: var(--danger);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 16px 2px 9px;
    }

    .summary {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    #refreshButton {
      border: 0;
      border-radius: 11px;
      padding: 9px 12px;
      background: #fff;
      border: 1px solid var(--line);
      color: #222;
      font-weight: 700;
    }

    #routes {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .route-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 14px rgba(0,0,0,.035);
    }

    .route-header {
      width: 100%;
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 0;
      background: #fff;
      padding: 12px 14px;
      color: var(--text);
      text-align: left;
    }

    .route-header:active {
      background: #f8f9fa;
    }

    .route-title {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .route-number {
      min-width: 46px;
      height: 42px;
      padding: 0 8px;
      border-radius: 11px;
      background: #f0f2f4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 850;
    }

    .route-name {
      font-size: 16px;
      font-weight: 800;
    }

    .route-count {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .chevron {
      color: #8a8f96;
      font-size: 18px;
      transition: transform .18s ease;
    }

    .route-card.open .chevron {
      transform: rotate(180deg);
    }

    .bags {
      display: none;
      border-top: 1px solid var(--line);
      padding: 7px 14px 12px;
      background: #fcfcfd;
    }

    .route-card.open .bags {
      display: block;
    }

    .bag {
      display: flex;
      align-items: center;
      min-height: 42px;
      padding: 7px 3px;
      border-bottom: 1px solid #eef0f2;
      font-size: 14px;
      word-break: break-all;
    }

    .bag:last-child {
      border-bottom: 0;
    }

    .bag-index {
      flex: 0 0 32px;
      color: #a0a4aa;
      font-size: 11px;
      font-weight: 800;
    }

    .bag-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }

    .state {
      text-align: center;
      color: var(--muted);
      padding: 42px 20px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .state.error {
      color: var(--danger);
    }

    .footer {
      text-align: center;
      color: #9a9da3;
      font-size: 11px;
      margin-top: 18px;
    }

    @media (min-width: 600px) {
      body { padding-left: 24px; padding-right: 24px; }
      h1 { font-size: 34px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="eyebrow">Operations</div>
      <h1>Route Dashboard</h1>
      <p class="sub" id="dataStatus">Loading scan data…</p>
    </header>

    <section class="search-card">
      <label class="search-label" for="searchInput">Find a bag</label>

      <div class="search-row">
        <input
          id="searchInput"
          type="search"
          inputmode="search"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Enter bag / QR number"
        >
        <button id="clearSearch" type="button" aria-label="Clear search">×</button>
      </div>

      <div id="searchResult" class="search-result"></div>
    </section>

    <div class="toolbar">
      <div class="summary" id="summary">0 routes · 0 bags</div>
      <button id="refreshButton" type="button">Refresh</button>
    </div>

    <main id="routes">
      <div class="state">Loading…</div>
    </main>

    <div class="footer">
      Data is read directly from Supabase. Nothing is downloaded to this device.
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ekhjtyrgedwojcehmmur.supabase.co";
    const SUPABASE_ANON_KEY =
      "sb_publishable_XTwFB9ADNwW9m470kwVVfw_0Cb_jhE0";
    const BUCKET = "results";

    const supabaseClient =
      window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const routesEl = document.getElementById("routes");
    const summaryEl = document.getElementById("summary");
    const statusEl = document.getElementById("dataStatus");
    const searchInput = document.getElementById("searchInput");
    const searchResult = document.getElementById("searchResult");
    const clearSearch = document.getElementById("clearSearch");
    const refreshButton = document.getElementById("refreshButton");

    let routeData = {};
    let sourceFile = null;

    function normalize(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    async function loadLatestResults() {
      setState("Loading scan data…");

      try {
        const { data: files, error: listError } =
          await supabaseClient.storage
            .from(BUCKET)
            .list("", {
              limit: 100,
              sortBy: { column: "created_at", order: "desc" }
            });

        if (listError) throw listError;

        const jsonFiles = (files || [])
          .filter(file =>
            file.name &&
            file.name.toLowerCase().endsWith(".json")
          )
          .sort((a, b) =>
            new Date(b.created_at || 0) -
            new Date(a.created_at || 0)
          );

        if (!jsonFiles.length) {
          routeData = {};
          sourceFile = null;
          renderRoutes();
          statusEl.textContent = "No uploaded scan results yet.";
          return;
        }

        sourceFile = jsonFiles[0];

        const { data, error: downloadError } =
          await supabaseClient.storage
            .from(BUCKET)
            .download(sourceFile.name);

        if (downloadError) throw downloadError;

        const text = await data.text();
        const parsed = JSON.parse(text);

        /*
          Supports:
            { routes: { "101": ["QR1", "QR2"] } }

          and also directly:
            { "101": ["QR1", "QR2"] }
        */
        routeData =
          parsed && parsed.routes
            ? parsed.routes
            : parsed || {};

        sanitizeRouteData();

        renderRoutes();

        const routeCount = Object.keys(routeData).length;
        const bagCount = countBags();

        statusEl.textContent =
          `Showing ${sourceFile.name}`;

        summaryEl.textContent =
          `${routeCount} route${routeCount === 1 ? "" : "s"} · ` +
          `${bagCount} bag${bagCount === 1 ? "" : "s"}`;

        runSearch();

      } catch (error) {
        console.error(error);

        routeData = {};
        sourceFile = null;

        routesEl.innerHTML = `
          <div class="state error">
            Could not load the Supabase results.<br><br>
            ${escapeHtml(error.message || "Unknown error")}
          </div>
        `;

        statusEl.textContent = "Unable to load scan data.";
        summaryEl.textContent = "0 routes · 0 bags";
      }
    }

    function sanitizeRouteData() {
      const clean = {};

      Object.keys(routeData || {}).forEach(route => {
        const values = Array.isArray(routeData[route])
          ? routeData[route]
          : [];

        clean[String(route)] = values
          .map(value => String(value ?? "").trim())
          .filter(Boolean);
      });

      routeData = clean;
    }

    function countBags() {
      return Object.values(routeData)
        .reduce((total, bags) => total + bags.length, 0);
    }

    function sortedRoutes() {
      return Object.keys(routeData).sort((a, b) => {
        const na = Number(a);
        const nb = Number(b);

        if (Number.isFinite(na) && Number.isFinite(nb)) {
          return na - nb;
        }

        return a.localeCompare(b);
      });
    }

    function renderRoutes() {
      const routes = sortedRoutes();

      if (!routes.length) {
        setState("No routes have been uploaded yet.");
        return;
      }

      routesEl.innerHTML = "";

      routes.forEach(route => {
        const bags = routeData[route];

        const card = document.createElement("article");
        card.className = "route-card";

        const header = document.createElement("button");
        header.className = "route-header";
        header.type = "button";
        header.innerHTML = `
          <div class="route-title">
            <div class="route-number">${escapeHtml(route)}</div>
            <div>
              <div class="route-name">Route ${escapeHtml(route)}</div>
              <div class="route-count">
                ${bags.length} scanned bag${bags.length === 1 ? "" : "s"}
              </div>
            </div>
          </div>
          <div class="chevron">⌄</div>
        `;

        const bagsEl = document.createElement("div");
        bagsEl.className = "bags";

        bags.forEach((bag, index) => {
          const row = document.createElement("div");
          row.className = "bag";
          row.innerHTML = `
            <div class="bag-index">${index + 1}</div>
            <div class="bag-value">${escapeHtml(bag)}</div>
          `;
          bagsEl.appendChild(row);
        });

        header.addEventListener("click", () => {
          card.classList.toggle("open");
        });

        card.appendChild(header);
        card.appendChild(bagsEl);
        routesEl.appendChild(card);
      });
    }

    function setState(message) {
      routesEl.innerHTML =
        `<div class="state">${escapeHtml(message)}</div>`;
    }

    function runSearch() {
      const query = normalize(searchInput.value);

      if (!query) {
        searchResult.className = "search-result";
        searchResult.textContent = "";
        return;
      }

      let foundRoute = null;
      let foundBag = null;

      for (const route of sortedRoutes()) {
        for (const bag of routeData[route]) {
          if (normalize(bag) === query) {
            foundRoute = route;
            foundBag = bag;
            break;
          }
        }

        if (foundRoute !== null) break;
      }

      /*
        Exact match first. If no exact match exists, allow a
        partial match only when it identifies one bag.
      */
      if (foundRoute === null) {
        const matches = [];

        for (const route of sortedRoutes()) {
          for (const bag of routeData[route]) {
            if (normalize(bag).includes(query)) {
              matches.push({ route, bag });
            }
          }
        }

        if (matches.length === 1) {
          foundRoute = matches[0].route;
          foundBag = matches[0].bag;
        }
      }

      searchResult.classList.add("show");

      if (foundRoute !== null) {
        searchResult.className =
          "search-result show found";

        searchResult.textContent =
          `Bag ${foundBag} was scanned on Route ${foundRoute}.`;

        highlightRoute(foundRoute);
      } else {
        searchResult.className =
          "search-result show not-found";

        searchResult.textContent =
          "The bag was not scanned yet.";
      }
    }

    function highlightRoute(route) {
      document.querySelectorAll(".route-card").forEach(card => {
        const number = card.querySelector(".route-number");
        const matches =
          number && number.textContent === String(route);

        if (matches) {
          card.classList.add("open");
          card.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });
        }
      });
    }

    searchInput.addEventListener("input", runSearch);

    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      searchInput.focus();
      runSearch();
    });

    refreshButton.addEventListener("click", async () => {
      refreshButton.disabled = true;
      refreshButton.textContent = "Loading…";

      await loadLatestResults();

      refreshButton.disabled = false;
      refreshButton.textContent = "Refresh";
    });

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadLatestResults();
  </script>
</body>
</html>
